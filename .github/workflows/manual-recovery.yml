name: Recuperar operación manual
on:
  push:
    branches: [main, fix/manual-operation]
  pull_request:
    paths: ['src/**', 'supabase/**', 'scripts/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generar migración con CLI
        run: |
          if ! ls supabase/migrations/*_win_manual_mode.sql >/dev/null 2>&1; then
            npx --yes supabase@2.65.5 migration new win_manual_mode
            target=$(ls supabase/migrations/*_win_manual_mode.sql)
            cp supabase/operations/manual-mode.sql "$target"
            echo "GENERATED_MIGRATION=$target"
          fi
          cmp supabase/operations/manual-mode.sql supabase/migrations/*_win_manual_mode.sql
      - run: node supabase/tests/manual-recovery.test.mjs
      - run: npm run test:calendar-move
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chrome webkit
      - name: Interfaz manual Chrome y Safari, sin producción
        run: |
          npm run preview -- --host 127.0.0.1 --port 5182 > /tmp/manual-preview.log 2>&1 &
          node scripts/manual-recovery-browser.mjs
          WIN_TEST_BROWSER=webkit node scripts/manual-recovery-browser.mjs
      - if: github.ref == 'refs/heads/main'
        run: node scripts/bar-production-smoke.mjs
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: manual_recovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - run: node supabase/tests/manual-recovery.test.mjs
        env:
          BAR_TEST_DATABASE_URL: postgres://postgres:isolated-test@localhost:5432/manual_recovery_test
