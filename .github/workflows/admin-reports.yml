name: Validar Administración interactiva
on:
  push:
    branches: [improvement/admin-reports, main]
    paths: ['src/**', 'scripts/admin*', 'scripts/bar-production-smoke.mjs', 'scripts/browser/admin-reports.spec.js', 'playwright.admin.config.js', '.github/workflows/admin-reports.yml']
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:admin-reports
      - run: npm run test:history
      - run: npm run test:money
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chrome webkit
      - run: npx playwright test --config=playwright.admin.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-report-browser-results
          path: |
            playwright-report
            test-results
