name: Validar costos Bar
on:
  push:
    branches: [main, bar-compras-simples]
  pull_request:
    paths: ['src/components/Bar*', 'src/components/StockCatalog.jsx', 'supabase/**']
permissions:
  contents: read
jobs:
  costs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:bar
      - run: node supabase/tests/bar-costs.test.mjs
      - run: node scripts/bar-cost-input.test.mjs
      - run: npm run test:money
      - run: node supabase/tests/bar-purchases.test.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chrome webkit
      - run: npx playwright test --config=playwright.money.config.js
