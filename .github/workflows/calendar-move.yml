name: Validar movimientos de Calendario
on:
  push:
    branches: [implementation/calendar-drag, main]
    paths: ['src/**', 'supabase/**', 'scripts/calendar*', '.github/workflows/calendar-move.yml']
  pull_request:
    paths: ['src/**', 'supabase/**', 'scripts/calendar*', '.github/workflows/calendar-move.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: win_calendar_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run test:calendar-move
      - run: npm run test:db
      - run: npm run test:users
      - run: npm run test:history
      - run: npm run test:ui
      - run: deno check supabase/functions/win-api/index.ts
      - run: python3 scripts/calendar-move-concurrency.py
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGDATABASE: win_calendar_ci
          PGUSER: postgres
          PGPASSWORD: disposable-ci-only
      - run: npm run build
