name: Validar Módulo 05
on:
  push:
    branches: [implementation/modulo-05, integration/calendario-historico, improvement/calendar-usability, implementation/bar-inventory]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: win_calendar_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cat supabase/calendar/schema.sql supabase/calendar/api.sql supabase/calendar/integration.sql supabase/calendar/compatibility.sql | cmp - supabase/migrations/20261124010226_win_calendar_m05.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: deno check supabase/functions/win-api/index.ts supabase/functions/win-courts/index.ts
      - run: npm run test:ui
      - run: npm run test:history
      - run: npm run test:db
      - run: npm run test:users
      - run: npm run test:bar
      - run: cmp supabase/operations/bar-stock.sql supabase/migrations/20261124124633_win_bar_inventory_cash_isolation.sql
      - run: python3 scripts/calendar-concurrency.py
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGDATABASE: win_calendar_ci
          PGUSER: postgres
          PGPASSWORD: disposable-ci-only
      - run: node scripts/calendar-utils.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: win-cloudflare-release
          path: dist
      - name: Preparar revisión local sin datos de producción
        run: |
          tar -czf /tmp/m05-build.tgz dist
          echo WIN_BUILD_START
          base64 -w 76 /tmp/m05-build.tgz
          echo WIN_BUILD_END

