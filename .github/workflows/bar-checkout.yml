name: Verificar cobros Bar
on:
  push:
    branches: [main, bar-cobros-seguros]
  pull_request:
    paths: ['src/barTransactions.js', 'src/components/QuickBar.jsx', 'supabase/functions/win-api/**', 'supabase/migrations/**', 'supabase/tests/bar-checkout.test.mjs']
concurrency:
  group: bar-checkout-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated
          POSTGRES_DB: checkout_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg@8.16.3 @playwright/test@1.56.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/win-api/index.ts
      - run: npm run test:bar
      - run: node supabase/tests/bar-checkout.test.mjs
      - run: node supabase/tests/bar-checkout.test.mjs
        env:
          BAR_TEST_DATABASE_URL: postgresql://postgres:isolated@127.0.0.1:5432/checkout_test
      - run: node scripts/bar-transactions.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chrome webkit
      - run: npx playwright test --config=playwright.checkout.config.js
