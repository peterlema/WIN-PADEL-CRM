name: Verificar cuentas privadas Bar
on:
  push:
    branches: [main, feat/bar-private-accounts]
  pull_request:
    paths: ['src/**', 'supabase/**', 'scripts/**']
permissions:
  contents: read
concurrency:
  group: bar-private-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generar archivo de migración
        run: |
          cmp supabase/operations/bar-private-accounts.sql supabase/migrations/20261125163707_win_bar_private_accounts.sql
          echo "MIGRATION_FILE=supabase/migrations/20261125163707_win_bar_private_accounts.sql"
      - run: node scripts/bar-production-smoke.mjs --inspect
      - run: npm ci
      - run: node supabase/tests/bar-private-accounts.test.mjs
      - run: node scripts/xlsx-export.test.mjs
      - run: node scripts/private-recovery.test.mjs
      - run: npm run test:bar-checkout
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chrome webkit
      - run: npx playwright test --config=playwright.private.config.js
      - name: Verificar web y API publicadas
        if: github.ref == 'refs/heads/main'
        run: node scripts/bar-production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bar-private-browser-results
          path: |
            test-results
            playwright-report
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: bar_private_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - run: node supabase/tests/bar-private-accounts.test.mjs
        env:
          BAR_TEST_DATABASE_URL: postgres://postgres:isolated-test@localhost:5432/bar_private_test
