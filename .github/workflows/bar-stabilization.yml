name: Verificar Bar diario
on:
  push:
    branches: [main, stabilize/bar-daily]
  pull_request:
    paths: ['src/components/Bar*', 'src/components/QuickBar.jsx', 'src/barTransactions.js', 'src/barDisplay.js', 'src/bar-daily.css', 'supabase/**', 'scripts/browser/bar-daily.spec.js']
permissions:
  contents: read
concurrency:
  group: bar-daily-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx --yes supabase migration new win_bar_cash_totals_compatibility
      - run: npm ci
      - run: node supabase/tests/bar-stabilization.test.mjs
      - run: npm run test:bar
      - run: npm run test:bar-costs
      - run: npm run test:bar-purchases
      - run: npm run test:bar-checkout
      - run: npm run test:money
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chrome webkit
      - run: npx playwright test --config=playwright.daily.config.js
      - run: npx playwright test --config=playwright.money.config.js
      - run: npx playwright test --config=playwright.checkout.config.js
      - name: Verificar publicación real
        if: github.ref == 'refs/heads/main'
        run: node scripts/bar-production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bar-daily-browser-results
          path: |
            test-results
            playwright-report
