name: Verificar Bar diario
on:
  push:
    branches: [stabilize/bar-daily]
permissions:
  contents: read
concurrency:
  group: bar-daily-fixed
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node supabase/tests/bar-stabilization.test.mjs
      - run: npm run test:bar
      - run: npm run test:bar-costs
      - run: npm run test:bar-purchases
      - run: npm run test:bar-checkout
      - run: npm run test:money
      - run: npm run build
