name: Verificar primera migración
on:
  push:
    branches: [main, feat/first-real-migration]
  pull_request:
    paths: ['src/**', 'supabase/**', 'scripts/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/bar-production-smoke.mjs --inspect
      - run: cmp supabase/operations/first-migration.sql supabase/migrations/20261126192140_win_first_real_migration.sql
      - run: npm run test:first-migration
      - run: npm run test:calendar-move
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chrome webkit
      - name: Chrome y WebKit, 1280 x 800, API interceptada
        run: |
          npm run preview -- --host 127.0.0.1 --port 5182 > /tmp/migration-preview.log 2>&1 &
          node scripts/first-migration-browser.mjs
          WIN_TEST_BROWSER=webkit node scripts/first-migration-browser.mjs
      - if: github.ref == 'refs/heads/main'
        run: node scripts/bar-production-smoke.mjs
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: first_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - run: node supabase/tests/first-migration.test.mjs
        env:
          BAR_TEST_DATABASE_URL: postgres://postgres:isolated-test@localhost:5432/first_migration_test
